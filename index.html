    <!-- `?lang=` links and the saved language choice: open the matching pre-rendered page. -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search), asked = params.get('lang'), saved = null;
        try { saved = localStorage.getItem('portfolio-lang'); } catch (e) {}
        var page = /^\/de(\/|$)/.test(location.pathname) ? 'de' : 'en';
        var want = asked === 'en' || asked === 'de' ? asked : page === 'en' && saved === 'de' ? 'de' : page;
        if (want === page) return;
        if (want === 'de') params.delete('lang');
        var query = params.toString();
        location.replace((want === 'de' ? '/de/' : '/') + (query ? '?' + query : '') + location.hash);
      })();
    </script>

    <!-- Apply the saved theme (or the system preference) before first paint. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('portfolio-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
