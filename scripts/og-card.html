<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#f6f5f0;overflow:hidden}
body{display:grid;grid-template-columns:1fr 320px;gap:64px;padding:72px 80px;align-items:center;color:#15201c;font-family:'IBM Plex Sans',sans-serif;border-top:10px solid #1d6b4f}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:#5f6b66}
h1{font-family:'Source Serif 4',serif;font-weight:500;font-size:96px;letter-spacing:-.02em;margin-top:18px;line-height:1}
.line{font-size:30px;color:#3a4541;margin-top:26px;line-height:1.35}
.avail{margin-top:40px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:500;color:#1d6b4f}
.dot{width:14px;height:14px;border-radius:50%;background:#1d6b4f}
.url{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:22px;color:#5f6b66}
.logo{width:320px;height:320px;justify-self:center}
</style></head><body>
<div>
<p class="eyebrow">Data Science · TU Dortmund</p>
<h1>Krish Soni</h1>
<p class="line">M.Sc. Data Science student. Data scientist with 17 months of industry experience.</p>
<p class="avail"><span class="dot"></span>Werkstudent · Internship · HiWi from Nov 2026</p>
<p class="url">sonikrish.com</p>
</div>
<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#091413"/>
  <text x="16" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7cc7a1">ks</text>
</svg>

</body></html>
